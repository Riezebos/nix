# Sterwerk candidate tracker: proxy provider in forward-auth mode.
#
# The Caddy half already exists in `modules/features/sterwerk.nix` - it proxies
# /outpost.goauthentik.io/* to the embedded outpost and copies the
# X-Authentik-* identity headers onto the upstream request. SterwerkWeb.Auth
# trusts `x-authentik-username`, which is only safe because the app binds
# 127.0.0.1 and Caddy is its sole client.
version: 1
metadata:
  name: foundry-sterwerk
entries:
  - id: sterwerk-provider
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: Provider for Sterwerk
    attrs:
      mode: forward_single
      external_host: https://sterwerk.datagiant.org/
      intercept_header_auth: true
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-invalidation-flow],
        ]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-entitlements],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/proxy/scope-proxy],
          ]

  - id: sterwerk-app
    model: authentik_core.application
    identifiers:
      slug: sterwerk
    attrs:
      name: Sterwerk
      provider: !KeyOf sterwerk-provider
      policy_engine_mode: any

  # Access gate: members of `sterwerk-users` only. Add people to that group in
  # the UI - membership is deliberately not repo-managed.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf sterwerk-app
      group: !Find [authentik_core.group, [name, sterwerk-users]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
