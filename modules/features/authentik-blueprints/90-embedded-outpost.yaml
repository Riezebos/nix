# The embedded outpost's provider list, owned in exactly one place.
#
# `providers` is a whole-list replacement, not an append: whatever is listed
# here is what the outpost ends up serving. That is why it is not spread across
# the per-application blueprints - a provider omitted here silently stops
# answering forward_auth, and its site starts 403ing for everyone.
#
# Runs last (90-) so every provider it references already exists.
version: 1
metadata:
  name: foundry-embedded-outpost
entries:
  - model: authentik_outposts.outpost
    identifiers:
      managed: goauthentik.io/outposts/embedded
    attrs:
      name: authentik Embedded Outpost
      type: proxy
      # `authentik_host` is what the outpost sends unauthenticated browsers to.
      # authentik only ever writes it once, at outpost creation, so it is sticky
      # state that a domain move has to correct by hand - pinning it here keeps
      # it correct on a rebuilt host too. Like `providers`, `config` is a
      # whole-value replacement; unset keys fall back to authentik's own
      # defaults (log_level info, refresh_interval 5m), which is what we want.
      config:
        authentik_host: https://auth.datagiant.org
      providers:
        - !Find [
            authentik_providers_proxy.proxyprovider,
            [name, Provider for Sterwerk],
          ]
