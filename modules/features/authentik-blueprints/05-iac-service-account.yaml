# The credential that makes the rest of this directory maintainable: a service
# account whose API token can read and write Authentik over
# https://auth.datagiant.org/api/v3/, so config can be inspected and diffed
# without clicking through the admin UI.
#
# This is the one deliberate exception to "users and memberships are managed in
# the UI". It is a machine identity, not a person, and it has to be recreated
# automatically or a rebuilt host would come back with no way to administer it
# except the UI. Human accounts stay out of this directory entirely.
#
# The key is read from a file that `authentik-prepare-secrets` generates on
# first boot, so no full-admin credential is ever committed here.
version: 1
metadata:
  name: foundry-iac-service-account
entries:
  - id: iac-user
    model: authentik_core.user
    identifiers:
      username: svc-iac
    attrs:
      name: IaC automation
      # Must be `service_account`, not `internal_service_account`: the latter
      # is reserved for outpost-owned identities and UserSerializer.validate
      # hard-refuses to update one, which would make this entry unappliable
      # from its second run onwards.
      type: service_account
      path: goauthentik.io/service-accounts
      is_active: true
      groups:
        - !Find [authentik_core.group, [name, authentik Admins]]

  - model: authentik_core.token
    identifiers:
      identifier: svc-iac-api
    attrs:
      user: !KeyOf iac-user
      intent: api
      expiring: false
      description: "Repo-managed: API access for blueprint tooling"
      key: !File /var/lib/authentik/secrets/iac-token
