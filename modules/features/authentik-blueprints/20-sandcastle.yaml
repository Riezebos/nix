# Agent Sandcastle: proxy provider in forward-auth mode, fronted by Caddy's
# `forward_auth` to the embedded outpost. Adopted as-is from the objects that
# were originally created by hand in the UI.
#
# The outpost binding is not here - see 90-embedded-outpost.yaml, which owns
# the whole provider list in one place so it cannot be half-written.
version: 1
metadata:
  name: foundry-sandcastle
entries:
  - id: sandcastle-provider
    model: authentik_providers_proxy.proxyprovider
    identifiers:
      name: Provider for Agent Sandcastle
    attrs:
      # forward_single: one domain, one provider. Caddy terminates TLS and
      # asks the outpost per-request; the outpost never proxies traffic itself.
      mode: forward_single
      external_host: https://sandcastle.simonito.com/
      intercept_header_auth: true
      authorization_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-authorization-implicit-consent],
        ]
      invalidation_flow:
        !Find [
          authentik_flows.flow,
          [slug, default-provider-invalidation-flow],
        ]
      property_mappings:
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-openid],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-email],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-profile],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/oauth2/scope-entitlements],
          ]
        - !Find [
            authentik_providers_oauth2.scopemapping,
            [managed, goauthentik.io/providers/proxy/scope-proxy],
          ]

  - id: sandcastle-app
    model: authentik_core.application
    identifiers:
      slug: sandcastle
    attrs:
      name: Agent Sandcastle
      provider: !KeyOf sandcastle-provider
      policy_engine_mode: any

  # Access gate: members of `app-users` only.
  - model: authentik_policies.policybinding
    identifiers:
      target: !KeyOf sandcastle-app
      group: !Find [authentik_core.group, [name, app-users]]
      order: 0
    attrs:
      enabled: true
      negate: false
      timeout: 30
