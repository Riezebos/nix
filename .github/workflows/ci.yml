name: ci

# One workflow, two jobs: build always runs; deploy runs only on push to main
# and only if build succeeded (job-level `needs`). Earlier attempt used two
# independent workflows which both triggered off the same push event and ran in
# parallel; concurrency groups do not gate one workflow on another.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          extra-conf: |
            accept-flake-config = true

      - name: Setup Cachix
        if: ${{ vars.CACHIX_CACHE_NAME != '' }}
        uses: cachix/cachix-action@f495f3ffa2f3810a92e5cc0abc2c5d6a2a07ec82 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # `nix flake check` is unusable here: on x86_64-linux it insists on
      # evaluating `homeConfigurations.simon-darwin` / `simon-m4`, whose
      # nixpkgs-devenv IFD patch derivation is pinned to aarch64-darwin
      # and cannot be built on a Linux runner.
      #
      # FoundryVTT's installer zip is also not available to GitHub Actions
      # because it is a personal-license file. Do not build deploy-rs checks
      # here: both the activator and schema checks realize the deploy profile,
      # which builds the system closure and would require the zip. The deploy
      # job uses deploy-rs remoteBuild so the real closure builds on foundry,
      # where the zip is seeded into the Nix store.
      - name: Build pre-commit checks
        run: |
          nix build --print-build-logs \
            .#checks.x86_64-linux.pre-commit

      - name: Evaluate deploy config
        run: |
          nix eval --json .#deploy >/dev/null

      # Instantiate the system closure. This catches eval errors in the
      # foundry module graph without trying to build the proprietary Foundry
      # package on the GitHub runner.
      #
      # We intentionally do NOT also build `…system.build.vm` here. The VM
      # variant evaluates `virtualisation.vmVariant` which assert-fails
      # on our `boot.initrd.network.ssh.hostKeys` referencing a string
      # path (`/etc/secrets/initrd/ssh_host_ed25519_key`) — VMs require
      # literal Nix paths so the secret can be embedded at build time,
      # but on the real box that file is provisioned at install via
      # nixos-anywhere --extra-files and doesn't exist in the flake.
      # Working around this would require a stack of vmVariant overrides
      # (disable initrd-SSH, replace LUKS/mdraid with a plain disk…)
      # that drift from the real config and stop catching useful bugs.
      # Instantiation here + remoteBuild + deploy-rs magic-rollback is the
      # real gate.
      - name: Instantiate foundry toplevel
        run: |
          nix eval --raw \
            .#nixosConfigurations.foundry.config.system.build.toplevel.drvPath

  deploy:
    needs: build
    # Only auto-deploy from `main`, and only when the event is a push
    # (or explicit workflow_dispatch from main). Skips for PRs, feature
    # branches, and PRs from forks.
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    # Never let two deploys overlap — half-activation is the one
    # outcome magic-rollback can't recover from.
    concurrency:
      group: deploy-foundry
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        with:
          # `trusted-users` is required by the "Seed FoundryVTT" step below.
          # `nix copy --no-check-sigs` is silently ineffective for an
          # untrusted client — nix refuses the path with "lacks a signature
          # by a trusted key" regardless of the flag (verified locally). The
          # installer probably grants the runner user trust already, but it
          # is not a documented input, so pin it here: this lands in
          # /etc/nix/nix.conf, which is authoritative, and is a harmless
          # no-op if redundant. `runner` is the user on ubuntu-latest.
          extra-conf: |
            accept-flake-config = true
            trusted-users = root runner

      # `skipPush: true` is a licensing guard, not an optimisation.
      #
      # `riezebos` is a PUBLIC cache. Since `remoteBuild = false`, this job
      # now realises the whole system toplevel on the runner — and that
      # closure contains the FoundryVTT outputs, which are per-seat licensed
      # commercial software. Pushing them here would publish ~468 MiB of
      # licensed software world-readable.
      #
      # `pushFilter` is NOT sufficient for this: cachix documents that
      # filtered paths are still pushed when they are part of another path's
      # closure, which is exactly the situation here. Only skipPush is a
      # real guarantee. The cache is still *pulled* from, which is all this
      # job needs it for.
      #
      # The build job above has no ssh access to foundry and only evaluates,
      # so it never holds the licensed paths and still pushes normally.
      - name: Setup Cachix
        if: ${{ vars.CACHIX_CACHE_NAME != '' }}
        uses: cachix/cachix-action@f495f3ffa2f3810a92e5cc0abc2c5d6a2a07ec82 # v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipPush: true

      # Load the deploy user's private key into ssh-agent. Matching
      # pubkey lives in modules/hosts/foundry/configuration.nix under
      # `users.users.deploy.openssh.authorizedKeys.keys`.
      - name: Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.FOUNDRY_DEPLOY_KEY }}

      # Pin the host key so the runner can't silently TOFU an MITM.
      # `FOUNDRY_KNOWN_HOSTS` = output of
      #   ssh-keyscan -t ed25519 -p 62222 <foundry-ip>
      # run once from a trusted machine.
      #
      # The ssh_config block applies keepalives to EVERY ssh process spawned
      # on this runner, including the connections nix pools for the
      # ssh-ng:// store. deploy-rs passes ServerAlive* via NIX_SSHOPTS, but
      # nix opens its first remote-store connection early and lets it sit
      # idle for the whole local evaluation (~20 min); the runner's NAT
      # dropped that idle mapping twice on 2026-07-21 and the later build
      # request went down the dead socket — a read that never returns.
      # Keepalives every 15s both hold the NAT mapping open and turn a dead
      # peer into a hard error within ~60s instead of a silent hang.
      - name: Pin host key and harden ssh
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.FOUNDRY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host *
            ServerAliveInterval 15
            ServerAliveCountMax 4
            TCPKeepAlive yes
          EOF
          chmod 600 ~/.ssh/config

      # Copy the already-built FoundryVTT outputs *from* foundry.
      #
      # FoundryVTT's installer zip is a personal-license file that lives only
      # in foundry's store, so the runner cannot build the `requireFile`
      # input. Rather than ship the zip to CI (licensing) or build the
      # package here (an npm build plus `brotli -9`/`zstd -19` over the whole
      # static tree — slow on a 2-core runner), we pull the four finished
      # outputs over the ssh connection we already have. The licensed bits
      # never leave your own machines.
      #
      # This is what makes `remoteBuild = false` possible; see the comment in
      # modules/deploy.nix. Evaluating the package is fine without the zip —
      # `requireFile` only fails at build time — so the output paths can be
      # computed here and fetched by path.
      #
      # `--no-check-sigs` because foundry does not sign its store paths; the
      # source is an authenticated ssh connection to a host we pin the key of.
      #
      # If this step fails with "path does not exist", foundry has not built
      # the pinned FoundryVTT version yet. See the FoundryVTT upgrade section
      # in docs/foundry/operations.md — the zip must be seeded and the
      # package built on foundry *before* CI can deploy a version bump.
      - name: Seed FoundryVTT from foundry
        run: |
          set -euo pipefail
          paths=$(nix eval --raw \
            --apply 'p: builtins.concatStringsSep " " (map (o: p.${o}.outPath) p.outputs)' \
            .#nixosConfigurations.foundry.config.services.foundryvtt.package)
          echo "Fetching from foundry:"
          for p in $paths; do echo "  $p"; done
          NIX_SSHOPTS="-o Port=62222 -o StrictHostKeyChecking=accept-new" \
            nix copy --no-check-sigs \
              --from "ssh-ng://deploy@${{ secrets.FOUNDRY_HOST }}" \
              $paths

      # `--hostname` overrides the placeholder in modules/deploy.nix so
      # the real IP never lands in this public repo. `--skip-checks`
      # because the build job above already built the deploy-rs
      # checks; re-running them here just doubles latency.
      # Uses `apps.deploy-rs` from this flake (flake-locked input).
      - name: Deploy
        # A wedged ssh/nix-daemon session or a unit that never finishes
        # activating would otherwise hang here until GitHub's 6h default.
        #
        # Two bounded attempts: deploy-rs is safe to re-run (magic-rollback
        # cleans up a failed activation, and store-level build/copy progress
        # persists on foundry), so a transient network failure costs one
        # retry instead of the whole deploy.
        #
        # Budgets are PROVISIONAL — re-tune once a few runs land.
        #
        # History: under `remoteBuild = true` the dominant cost was
        # `nix copy --derivation` shipping ~6600 drvs over ssh-ng, measured
        # at 32-45 min and immune to a warm store. The old 60m/25m pair was
        # miscalibrated to the point that the 25 min second attempt sat below
        # the observed cost of that phase alone, so from cold it could never
        # succeed — on 2026-08-03 both attempts expired without foundry
        # building a single derivation.
        #
        # That phase is now gone (see modules/deploy.nix). deploy-rs builds
        # locally and copies the profile with `--substitute-on-destination`,
        # so foundry pulls the bulk from cache.nixos.org itself and only
        # runner-built paths (~670 small unit files and symlink farms) go
        # over ssh. Expect roughly 5-15 min. 45m/30m is therefore generous
        # headroom rather than a measured figure; tighten it once real
        # timings exist.
        timeout-minutes: 90
        run: |
          attempt=0
          for budget in 45m 30m; do
            attempt=$((attempt + 1))
            rc=0
            # `--debug-logs` is what makes a stall diagnosable. Without it
            # deploy-rs passes `--log-format internal-json` to nix and
            # consumes the stream itself (push.rs), so a hung phase prints
            # nothing at all — the 2026-08-03 run was 57 min of silence.
            # With it, nix's own progress reaches the CI log.
            # Trailing `--` args go to deploy-rs's `extra_build_args`, which
            # are appended to the `nix build` invocations only (not to
            # `nix copy`), so `-L` is safe here.
            timeout "${budget}" nix run .#deploy-rs -- \
              --debug-logs \
              --skip-checks \
              --hostname "${{ secrets.FOUNDRY_HOST }}" \
              .#foundry \
              -- --print-build-logs || rc=$?
            if [ "$rc" = 0 ]; then
              exit 0
            fi
            echo "::warning::deploy attempt ${attempt} (${budget} budget) failed (exit ${rc}; 124 means per-attempt timeout)"
            if [ "$attempt" = 1 ]; then sleep 30; fi
          done
          exit 1
